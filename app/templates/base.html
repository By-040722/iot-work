<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智能故障诊断系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">⚙</span>
                    <span class="logo-text">轴承智能诊断</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">
                        <span class="nav-icon">📊</span>仪表盘
                    </a></li>
                    <li><a href="/diagnose" class="{% if active_page == 'diagnose' %}active{% endif %}">
                        <span class="nav-icon">🔍</span>在线诊断
                    </a></li>
                    <li><a href="/data" class="{% if active_page == 'data' %}active{% endif %}">
                        <span class="nav-icon">📁</span>数据管理
                    </a></li>
                    <li><a href="/model" class="{% if active_page == 'model' %}active{% endif %}">
                        <span class="nav-icon">🤖</span>模型管理
                    </a></li>
                    <li><a href="/history" class="{% if active_page == 'history' %}active{% endif %}">
                        <span class="nav-icon">📋</span>历史记录
                    </a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>系统运行中</span>
                </div>
                <div class="version">v1.0.0</div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">{% block page_title %}仪表盘{% endblock %}</h1>
                </div>
                <div class="topbar-right">
                    <div class="model-status" id="modelStatus">
                        <span class="status-label">当前模型:</span>
                        <span class="status-value" id="currentModel">加载中...</span>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- 消息提示 -->
    <div class="toast" id="toast"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
