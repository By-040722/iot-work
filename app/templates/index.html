{% extends "base.html" %}
{% block title %}仪表盘 - 智能故障诊断系统{% endblock %}
{% block page_title %}仪表盘{% endblock %}

{% block content %}
<!-- 统计卡片 -->
<div class="stats-grid">
    <div class="stat-card blue">
        <div class="stat-label">诊断总次数</div>
        <div class="stat-value" id="totalDiagnosis">0</div>
    </div>
    <div class="stat-card orange">
        <div class="stat-label">异常检出数</div>
        <div class="stat-value" id="anomalyCount">0</div>
    </div>
    <div class="stat-card green">
        <div class="stat-label">平均健康度</div>
        <div class="stat-value" id="avgHealth">0<span class="stat-unit">分</span></div>
    </div>
    <div class="stat-card red">
        <div class="stat-label">异常率</div>
        <div class="stat-value" id="anomalyRate">0<span class="stat-unit">%</span></div>
    </div>
</div>

<!-- 图表行 -->
<div class="chart-row">
    <div class="card">
        <div class="card-title">故障类型分布</div>
        <div class="chart-container" id="faultDistributionChart"></div>
    </div>
    <div class="card">
        <div class="card-title">健康度分布</div>
        <div class="chart-container" id="healthDistributionChart"></div>
    </div>
</div>

<!-- 最近诊断记录 -->
<div class="card">
    <div class="card-title">最近诊断记录</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>文件名</th>
                    <th>故障类型</th>
                    <th>置信度</th>
                    <th>健康度</th>
                    <th>诊断时间</th>
                </tr>
            </thead>
            <tbody id="recentRecordsBody">
                <tr><td colspan="6" style="text-align:center;color:#8c8c8c;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 加载统计数据
async function loadStats() {
    const result = await apiRequest('/api/diagnose/stats');
    if (result.success && result.data) {
        const data = result.data;
        document.getElementById('totalDiagnosis').textContent = data.total_diagnosis;
        document.getElementById('anomalyCount').textContent = data.anomaly_count;
        document.getElementById('avgHealth').innerHTML = data.avg_health_score + '<span class="stat-unit">分</span>';
        document.getElementById('anomalyRate').innerHTML = (data.anomaly_rate * 100).toFixed(1) + '<span class="stat-unit">%</span>';

        // 故障类型分布饼图
        const faultChart = initChart('faultDistributionChart');
        const faultData = Object.entries(data.fault_distribution || {}).map(([name, value]) => ({ name, value }));
        faultChart.setOption({
            tooltip: { trigger: 'item' },
            legend: { bottom: 0, type: 'scroll' },
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                avoidLabelOverlap: false,
                itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                label: { show: true, formatter: '{b}: {c} ({d}%)' },
                data: faultData.length > 0 ? faultData : [{ name: '暂无数据', value: 1 }],
                color: ['#52c41a', '#1890ff', '#fa8c16', '#f5222d', '#722ed1', '#13c2c2']
            }]
        });
    }
}

// 加载最近记录
async function loadRecentRecords() {
    const result = await apiRequest('/api/diagnose/records?page=1&size=5');
    const tbody = document.getElementById('recentRecordsBody');
    if (result.success && result.data.records.length > 0) {
        tbody.innerHTML = result.data.records.map(r => `
            <tr>
                <td>${r.id}</td>
                <td>${r.file_name}</td>
                <td>${getFaultTag(r.fault_type)}</td>
                <td>${(r.confidence * 100).toFixed(1)}%</td>
                <td>${r.health_score} ${getHealthTag(r.health_score)}</td>
                <td>${r.created_at}</td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#8c8c8c;">暂无诊断记录</td></tr>';
    }
}

// 健康度分布柱状图
function initHealthChart() {
    const chart = initChart('healthDistributionChart');
    chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
            type: 'category',
            data: ['优秀(80-100)', '良好(60-80)', '注意(40-60)', '恶化(20-40)', '严重(0-20)']
        },
        yAxis: { type: 'value', name: '次数' },
        series: [{
            type: 'bar',
            data: [0, 0, 0, 0, 0],
            itemStyle: {
                color: function(params) {
                    const colors = ['#52c41a', '#13c2c2', '#fa8c16', '#f5222d', '#8b0000'];
                    return colors[params.dataIndex];
                },
                borderRadius: [4, 4, 0, 0]
            },
            barWidth: '50%'
        }]
    });
}

// 页面加载
document.addEventListener('DOMContentLoaded', () => {
    loadStats();
    loadRecentRecords();
    initHealthChart();
});
</script>
{% endblock %}
