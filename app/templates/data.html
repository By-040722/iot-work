{% extends "base.html" %}
{% block title %}数据管理 - 智能故障诊断系统{% endblock %}
{% block page_title %}数据管理{% endblock %}

{% block content %}
<!-- 上传数据集 -->
<div class="card">
    <div class="card-title">上传数据集</div>
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;">
        <div class="form-group" style="flex:1;min-width:200px;">
            <label class="form-label">数据集名称</label>
            <input type="text" class="form-input" id="datasetName" placeholder="请输入数据集名称">
        </div>
        <div class="form-group" style="flex:2;min-width:300px;">
            <label class="form-label">描述（可选）</label>
            <input type="text" class="form-input" id="datasetDesc" placeholder="请输入数据集描述">
        </div>
        <div class="form-group">
            <label class="form-label">选择文件</label>
            <input type="file" id="datasetFile" accept=".csv" class="form-input" style="padding:6px;">
        </div>
        <button class="btn btn-primary" id="uploadDatasetBtn">上传数据集</button>
    </div>
</div>

<!-- 数据集列表 -->
<div class="card">
    <div class="card-title">数据集列表</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>文件大小</th>
                    <th>样本数</th>
                    <th>特征数</th>
                    <th>类别数</th>
                    <th>上传时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="datasetTableBody">
                <tr><td colspan="8" style="text-align:center;color:#8c8c8c;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 数据集预览 -->
<div class="card" id="previewCard" style="display:none;">
    <div class="card-title">数据集预览 <span id="previewName" style="font-size:13px;color:#8c8c8c;font-weight:normal;"></span></div>
    <div class="table-container">
        <table>
            <thead id="previewHead"></thead>
            <tbody id="previewBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 加载数据集列表
async function loadDatasets() {
    const result = await apiRequest('/api/data/list?page=1&size=50');
    const tbody = document.getElementById('datasetTableBody');
    if (result.success && result.data.datasets.length > 0) {
        tbody.innerHTML = result.data.datasets.map(d => `
            <tr>
                <td>${d.id}</td>
                <td>${d.name}</td>
                <td>${formatFileSize(d.file_size)}</td>
                <td>${d.n_samples || '-'}</td>
                <td>${d.n_features || '-'}</td>
                <td>${d.n_classes || '-'}</td>
                <td>${d.created_at}</td>
                <td>
                    <button class="btn btn-sm btn-default" onclick="previewDataset(${d.id}, '${d.name}')">预览</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDataset(${d.id})">删除</button>
                </td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8c8c8c;">暂无数据集</td></tr>';
    }
}

// 上传数据集
document.getElementById('uploadDatasetBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('datasetFile');
    const name = document.getElementById('datasetName').value.trim();
    const desc = document.getElementById('datasetDesc').value.trim();

    if (!fileInput.files.length) {
        showToast('请选择数据集文件', 'warning');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('name', name || fileInput.files[0].name);
    formData.append('description', desc);

    showLoading('正在上传数据集...');
    const result = await apiRequest('/api/data/upload', { method: 'POST', body: formData });
    hideLoading();

    if (result.success) {
        showToast('数据集上传成功！', 'success');
        document.getElementById('datasetName').value = '';
        document.getElementById('datasetDesc').value = '';
        fileInput.value = '';
        loadDatasets();
    } else {
        showToast('上传失败: ' + result.error, 'error');
    }
});

// 预览数据集
async function previewDataset(id, name) {
    showLoading('正在加载预览...');
    const result = await apiRequest(`/api/data/${id}/preview?rows=10`);
    hideLoading();

    if (result.success && result.data && !result.data.error) {
        document.getElementById('previewCard').style.display = 'block';
        document.getElementById('previewName').textContent = '- ' + name;
        document.getElementById('previewHead').innerHTML = '<tr>' + result.data.columns.map(c => `<th>${c}</th>`).join('') + '</tr>';
        document.getElementById('previewBody').innerHTML = result.data.data.map(row =>
            '<tr>' + row.map(cell => `<td>${typeof cell === 'number' ? cell.toFixed(4) : cell}</td>`).join('') + '</tr>'
        ).join('');
        document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth' });
    } else {
        showToast('预览失败: ' + (result.data?.error || '未知错误'), 'error');
    }
}

// 删除数据集
async function deleteDataset(id) {
    if (!confirm('确定要删除该数据集吗？')) return;
    const result = await apiRequest(`/api/data/${id}`, { method: 'DELETE' });
    if (result.success) {
        showToast('删除成功', 'success');
        loadDatasets();
    } else {
        showToast('删除失败', 'error');
    }
}

document.addEventListener('DOMContentLoaded', loadDatasets);
</script>
{% endblock %}
